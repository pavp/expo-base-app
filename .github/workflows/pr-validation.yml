name: PR Validation

on:
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run TypeScript
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run Jest
        run: pnpm test

  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No dependency install needed: the script is plain Node with zero deps.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # `github.head_ref` is the source branch name. HEAD is a detached merge
      # commit on pull_request events, so the name cannot be read from git.
      - name: Validate branch name
        run: node scripts/validate-branch-name.js "$BRANCH_NAME"
        env:
          BRANCH_NAME: ${{ github.head_ref }}

  validate-commits:
    name: Validate commits
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is required: commitlint walks the commit range, and the
      # default shallow clone (depth 1) has no ancestry to walk.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      # `--from`/`--to` reads each commit through git, so bodies and footers are
      # validated too — piping `git log --format=%s` would check subjects only.
      #
      # On pull_request events HEAD is a detached merge commit that belongs to
      # neither branch, so `origin/main..HEAD` would include that synthetic
      # commit. The two event SHAs are the real endpoints: `base.sha` is the tip
      # of the target branch the PR was compared against, and `head.sha` is the
      # tip of the source branch — so the range covers exactly the PR's own
      # commits and no merge commit.
      - name: Run commitlint
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  ready-to-merge:
    name: Ready to merge
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, validate-branch-name, validate-commits]
    if: always()
    steps:
      # Single required status check for branch protection. Each dependency is
      # checked explicitly so a skipped or cancelled job cannot pass as success.
      - name: Verify all checks passed
        run: |
          failed=0
          for entry in \
            "lint:${{ needs.lint.result }}" \
            "typecheck:${{ needs.typecheck.result }}" \
            "test:${{ needs.test.result }}" \
            "validate-branch-name:${{ needs.validate-branch-name.result }}" \
            "validate-commits:${{ needs.validate-commits.result }}"; do
            job="${entry%%:*}"
            result="${entry##*:}"
            if [ "$result" != "success" ]; then
              echo "Job '$job' did not succeed (result: $result)."
              failed=1
            else
              echo "Job '$job' succeeded."
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."
